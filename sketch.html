<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Sketch — Forgotten Badge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23fff%22/%3E%3Cpath d=%22M3 13 L13 3%22 stroke=%22%23111%22 stroke-width=%222%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/sketch.css">
</head>
<body>
  <header class="bar">
    <nav class="pages" id="pages">
      <button data-page="outside" class="is-on">Outside</button>
      <button data-page="ground">Ground floor</button>
      <button data-page="first">1st floor</button>
      <button data-page="extra">Extra</button>
    </nav>
    <div class="tools">
      <button data-tool="pen" class="tool is-on" title="Pen (P)">Pen</button>
      <button data-tool="eraser" class="tool" title="Eraser (E)">Eraser</button>
      <button data-tool="text" class="tool" title="Text label (T)">Text</button>
      <span class="sep"></span>
      <button data-color="#111111" class="swatch is-on" style="--c:#111111" title="Black"></button>
      <button data-color="#d6332e" class="swatch" style="--c:#d6332e" title="Red"></button>
      <button data-color="#2f6fd6" class="swatch" style="--c:#2f6fd6" title="Blue"></button>
      <button data-color="#2e9e4f" class="swatch" style="--c:#2e9e4f" title="Green"></button>
      <span class="sep"></span>
      <button data-size="3" class="size" title="Thin"><i style="--s:3px"></i></button>
      <button data-size="6" class="size is-on" title="Medium"><i style="--s:6px"></i></button>
      <button data-size="12" class="size" title="Thick"><i style="--s:11px"></i></button>
      <span class="sep"></span>
      <button id="undo" title="Undo (Cmd+Z)">Undo</button>
      <button id="clear" title="Clear this page">Clear</button>
    </div>
    <span id="status" class="status">Draw — it saves by itself</span>
  </header>
  <main class="paper-wrap">
    <canvas id="paper" width="2400" height="1500"></canvas>
  </main>
  <script src="js/sketch.js"></script>
</body>
</html>
